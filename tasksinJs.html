<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
</head>
<body>
    <Script>
        // 1. 
let arr1 = [100, 200, 300, 400];

let result1 = arr1.map(num => num + 1000);

console.log("Add 1000:", result1);



//2.
let arr2 = [5, 10, 15];

let result2 = arr2.map(num => num * 2);

console.log("Double values:", result2);



// 3. 
let animals = ['cat', 'dog', 'lion'];

let upperAnimals = animals.map(animal => animal.toUpperCase());

console.log("Uppercase:", upperAnimals);



// 4. 
const products = [
  { name: 'Laptop', price: 50000 },
  { name: 'Phone', price: 25000 }
];


let prices = products.map(product => product.price);

console.log("Prices:", prices);



let updatedPrices = products.map(product => product.price + 200);

console.log("Prices after GST:", updatedPrices);
// [50200, 25200]



let productsWithGST = products.map(product => ({
  ...product,
  price: product.price + 200
}));

console.log("Products with GST:", productsWithGST);


// 5.
let names = ['rahul', 'aman'];

let nameObjects = names.map(name => ({
  name: name.charAt(0).toUpperCase() + name.slice(1)
}));

console.log("Object array:", nameObjects);

    </Script>
</body>
</html>
