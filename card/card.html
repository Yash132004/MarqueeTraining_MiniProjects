<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card.css">
</head>  
<body>
    <div class="outer">
        <div class="color">
            <div class="profile">
                <img class="img1"  src="dp.png" alt="profilePicture">
            </div>
        </div>
        <div class="layer1">
            <h2 class="cl" style="margin-bottom: 0px;">CodingLab</h2>
            <h3 class="cl2" >YouTuber & Blogger</h3>
        </div>
        <div class="logos">
            <ul>
                <li><img class="l" src="facebook.png"></li>
                <li><img class="l" src="insta.jpg"></li>
                <li><img class="l" src="twitter.png"></li>
                <li><img class="l" src="youtube.png"></li>
            </ul>
        </div>
        <div class="icons">
            <div class="like"><img class="ic"src = "like.png" alt ="icon"> <h5>386k</h5></div>
            <div class="share"><img class="ic" src = "shares.png" alt ="icon"> <h5>94k</h5></div>
            <div class="cmnt"><img class="ic" src = "cmnt.png" alt ="icon"> <h5>150k</h5></div>
        </div>
    </div>
</body>
</html>
