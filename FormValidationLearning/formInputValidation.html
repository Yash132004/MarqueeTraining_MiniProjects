<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Validation</title>
</head>
<body>
    <form action="" method="post">
        <p>Enter Your Name:</p>
        <input type = "text" required>

        <p>Enter Your Email</p>
        <input type="email" required>

        <p>Enter Your Age: </p>
        <input id="age" type="number" required>

        <p>Have You Checked-In the Hotel?</p>
        <input id="checkIn"  type="checkbox">

        <p>Enter Your Room Number: </p>
        <input id="roomNo" type="text">


        <p>Please Accept Terms & conditions : </p>
        <input id="checkBox" type="checkbox" required>

        <button type ="submit">Submit</button>
    </form>

    <script>

        let check = document.querySelector('#checkBox');
        let submit = document.querySelector('button');
        submit.setAttribute("disabled", 'true');
        
        check.addEventListener('click',()=>{
            if(check.checked){
                submit.removeAttribute("disabled");
            }else{
                submit.setAttribute("disabled", 'true');
            }
        });

        let form = document.querySelector('form');
        let age = document.querySelector('#age');

        form.addEventListener('submit', (e)=>{
            e.preventDefault();
            console.log("Form is in Validation Period!");
        });

        submit.addEventListener('click',()=>{
            if(age.value < 18){
                console.log("You are not eligible to submit the form!");
            }
        });

        let checkin = document.querySelector('#checkIn');
        let roomNo = document.querySelector('#roomNo');
        
        checkin.addEventListener('change',()=>{
            if(checkin.checked){
                roomNo.setAttribute("required", 'true');
            }else{
                roomNo.removeAttribute("required");
            }
        });

    </script>
</body>
</html>
