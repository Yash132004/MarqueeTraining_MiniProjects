<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Input</title>
</head>
<body>
    <input type="file" id="fileInput" accept=".png, .jpg" />

    <script>
        const fileInput = document.getElementById('fileInput');

        fileInput.addEventListener('change', (event) => {
            
            const fileList = event.target.files; 
            
            if (fileList.length > 0) {
                const file = fileList[0];
                
                // Metadata available on the File object
                console.log("File Name:", file.name);      // e.g., "avatar.png"
                console.log("File Size:", file.size);      // Size in bytes
                console.log("File Type:", file.type);      // MIME type (e.g., "image/png")
            }
        });

    </script>
</body>
</html>
