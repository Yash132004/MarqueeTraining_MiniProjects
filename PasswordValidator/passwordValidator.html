<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validator</title>
    <style>
        .outer{
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: beige;
            width:500px;
            height:500px;
            border:1px solid black;
            border-radius: 30px;
        }
        .pass{
            width:300px;
            height:40px;
            border-radius:20px;
            border:1px solid grey;
            padding-left:10px;
        }
        span{
            display:block;
            margin-top:10px;
            color:red;
        }
        .pv{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color:blue;
            font-size: 20px;
        }
    </style>
</head>
<body>
<div class="outer">
    <h4 class ="pv">Password Validator</h4>
    <input type="text" class="pass" placeholder="Enter Your Password">
    <span></span>
</div>


<script>
let input = document.querySelector(".pass");
let sp = document.querySelector("span");

input.addEventListener("input", function () {

    let password = input.value;

    let num = false;
    let special = false;
    let upp = false;

    for (let ch of password) {
        if (ch >= '0' && ch <= '9') {
            num = true;
        } else if ("!@#$%^&*()_+-=[]{}|;:',.<>?/".includes(ch)) {
            special = true;
        } else if (ch >= 'A' && ch <= 'Z') {
            upp = true;
        }
    }

    let msg = "";

    if (password.length <= 8) {
        msg += "Password must contains atleast 8 characters.<br>";
    }

    if (!num) {
        msg += "At least one number is required.<br>";
    }

    if (!special) {
        msg += "At least one special character is required.<br>";
    }

    if (!upp) {
        msg += "At least one uppercase letter is required.<br>";
    }

    if (msg === "") {
        msg = "<span style='color:green'> Strong Password</span>";
    }

    sp.innerHTML = msg;
});
</script>

</body>
</html>
