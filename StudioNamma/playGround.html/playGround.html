<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Ground</title>
    <link rel="stylesheet" href="playGround.css">
</head>
<body>

    <div class="cursor-dot" id="cursorDot"></div>

    <div class="outer"> 
        <div class="playground-heading" id="playgroundHeading">
            <div class="textAnimate">
                <div class="animateChar">P</div>
                <div class="animateChar">L</div>
                <div class="animateChar">A</div>
                <div class="animateChar">Y</div>
                <div class="animateChar">G</div>
                <div class="animateChar">R</div>
                <div class="animateChar">O</div>
                <div class="animateChar">U</div>
                <div class="animateChar">N</div>
                <div class="animateChar">D</div>
            </div>

            <div class="portfolio-badge" id="portfolioBadge">Portfolio</div>
        </div>
    </div>

    <script>
      
const cursorDot = document.getElementById('cursorDot');

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let dotX = mouseX;
let dotY = mouseY;

window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function animateDot() {
    dotX += (mouseX - dotX) * 0.2;
    dotY += (mouseY - dotY) * 0.2;
    cursorDot.style.transform = `translate(${dotX}px, ${dotY}px) translate(100%, 100%)`;
    requestAnimationFrame(animateDot);
}
requestAnimationFrame(animateDot);

//Portfolio badge that follows the cursor on hover
const heading = document.getElementById('playgroundHeading');
const badge = document.getElementById('portfolioBadge');

let badgeX = 0;
let badgeY = 0;
let targetX = 0;
let targetY = 0;
let badgeRAF = null;

function animateBadge() {
    badgeX += (targetX - badgeX) * 0.2;
    badgeY += (targetY - badgeY) * 0.2;
    badge.style.left = `${badgeX}px`;
    badge.style.top = `${badgeY}px`;
    badge.style.transform = `translate(10%, 65%) rotate(-10deg)`;
    badgeRAF = requestAnimationFrame(animateBadge);
}

heading.addEventListener('mouseenter', (e) => {
    heading.classList.add('is-hovering');
    badgeX = e.clientX;
    badgeY = e.clientY;
    targetX = e.clientX;
    targetY = e.clientY;
    if (!badgeRAF) animateBadge();
});

heading.addEventListener('mousemove', (e) => {
    cursorDot.style.visibility = "hidden";
    targetX = e.clientX;
    targetY = e.clientY;
});

heading.addEventListener('mouseleave', () => {
    cursorDot.style.visibility = "visible";
    heading.classList.remove('is-hovering');
    if (badgeRAF) {
        cancelAnimationFrame(badgeRAF);
        badgeRAF = null;
    }
});

// // optional: clicking the heading navigates to a portfolio section/page
// heading.addEventListener('click', () => {
//     // change this to wherever your portfolio content lives
//     // window.location.href = '#portfolio';
//     console.log('Navigate to Portfolio');
// });
    </script>
</body>
</html>
