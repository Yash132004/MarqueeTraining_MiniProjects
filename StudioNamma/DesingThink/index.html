<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioNamma</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="outer">
        <div class="scene">
            <div class="floater">
                <video autoplay loop muted data-object-fit="cover">
                    <source src="cursorVideo.mp4">
                </video>
            </div>
        </div>
        <div class="container">
            <div class="line-mask">
                <div class="line-inner">WE THINK</div>
            </div>
            <div class="line-mask">
                <div class="line-inner">CRAFT AND</div>
            </div>
            <div class="line-mask">
                <div class="line-inner">DESIGN</div>
            </div>
        </div>
    </div>

    <script>
        function playReveal() {
            document.querySelectorAll('.line-inner').forEach((el, i) => {
                setTimeout(() => {
                el.style.transition = 'transform 0.8s cubic-bezier(0.65, 0, 0.35, 1)';
                el.style.transform = 'translateY(0%)';
                }, i * 120);
            });
        }

        window.addEventListener('load', playReveal);
// Floater Funtioning
const floater = document.querySelector(".floater");

let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let pos = { x: mouse.x, y: mouse.y };
let prevPos = { x: pos.x, y: pos.y };

let rotation = { x: 0, y: 0 };

const posEase = 0.15;    //how fast the box catches up to the cursor
const rotEase = 0.12;    //how fast the tilt catches up
const maxTilt = 50;      //clamp tilt angle in degrees
const tiltStrength = 1.5; //sensitivity of tilt speed

window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

function animate() {
    prevPos.x = pos.x;
    prevPos.y = pos.y;

    // position lerp — the "chase" lag
    pos.x += (mouse.x - pos.x) * posEase;
    pos.y += (mouse.y - pos.y) * posEase;

    //velocity this frame
    const vx = pos.x - prevPos.x;
    const vy = pos.y - prevPos.y;

    // moving right/left tilts around the Y axis
    // moving up/down tilts around the X axis (inverted, so moving down tilts "forward")
    let targetRotY = Math.max(-maxTilt, Math.min(maxTilt, vx * tiltStrength));
    let targetRotX = Math.max(-maxTilt, Math.min(maxTilt, -vy * tiltStrength));

    //smooth the tilt so it eases in AND springs back to 0 when idle
    rotation.x += (targetRotX - rotation.x) * rotEase;
    rotation.y += (targetRotY - rotation.y) * rotEase;

    const w = floater.offsetWidth;
    const h = floater.offsetHeight;

    floater.style.transform =
        `translate3d(${pos.x - w / 2}px, ${pos.y - h / 2}px, 0)
         rotateX(${rotation.x}deg)
         rotateY(${rotation.y}deg)`;

    requestAnimationFrame(animate);
}

animate();
    </script> 

</body>
</html>
