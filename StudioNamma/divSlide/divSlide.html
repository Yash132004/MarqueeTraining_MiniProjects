<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Slide</title>
    <link rel="stylesheet" href="divSlide.css">
</head>
<body> 
    <div class="outer">
        <div class="divMatera">
            <video autoplay muted loop class="layer materaVid">
                <source  src="matera-highlight-2.mp4">
            </video>
            <img class="layer materaImg" src="materaDiv.webp">
        </div>
        <div class="divChance">
            <video autoplay muted loop class="layer chanceVid">
                <source src="chance-cover.mp4" >
            </video>
            <img class="layer chanceImg" src="changeImg.webp">
        </div>
    </div>

    <script>
        let div1 = document.querySelector(".divMatera");
        let div2 = document.querySelector(".divChance");

        let div1Img = document.querySelector(".materaImg");
        let div2Img = document.querySelector(".chanceImg");
        div1.addEventListener('mouseenter', (e)=>{
            // div1Img.style.visibility = 'hidden';
            div1Img.style.filter = "blur(5px)";
            div1Img.style.zIndex = -1;
            div1Img.style.opacity = 1;
            
        });
        
        div2.addEventListener('mouseenter',(e)=>{
            // div2Img.style.visibility = 'hidden';
            div2Img.style.zIndex = -1;
            div2Img.style.filter = "blur(5px)";
            div2Img.style.opacity = 1;
        })
        
        div1.addEventListener('mouseleave',(e)=>{
            div1Img.style.zIndex = 2;
            // div1Img.style.visibility = 'visible';
            div1Img.style.filter = "blur(0px)";
        });
        
        div2.addEventListener('mouseleave',(e)=>{
            div2Img.style.filter = "blur(0px)";
            div2Img.style.zIndex = 2;
            // div2Img.style.visibility = 'visible';
        });
    </script>
</body>
</html>
