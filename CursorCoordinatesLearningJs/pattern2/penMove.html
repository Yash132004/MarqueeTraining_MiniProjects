<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen Creation</title>
    <style>
        body{
            margin:0;
            overflow:hidden;
            background:white;
        }

        .common{
            width:25px;
            height:25px;
            /* border-radius:50%; */
            position:absolute;
        }

        button{
            position:relative;
            z-index:1000;
            margin:10px;
            padding:10px 20px;
        }
    </style>
</head>
<body>

    <button id="wr">Write</button>
    <button id="er">Erase</button>


    <script>

        let mode = "write";

        document.getElementById("wr").addEventListener("click", () => {
            mode = "write";
        });

        document.getElementById("er").addEventListener("click", () => {
            mode = "erase";
        });

        document.addEventListener("mousemove", (event) => {

            let newdiv = document.createElement("div");
            newdiv.classList.add("common");

            newdiv.style.left = event.clientX + "px";
            newdiv.style.top = event.clientY + "px";

            if (mode === "write") {
                newdiv.style.backgroundColor = "red";
            } else {
                newdiv.style.backgroundColor = "white";
                newdiv.style.width = 50 + "px";
                newdiv.style.height = 50 + "px";
            }

            document.body.appendChild(newdiv);

        });

    </script>

</body>
</html>
