<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnchorBlock</title>
</head>
<body>
    <a href = "https://google.com">Google</a>

    <script>
        let anchor = document.querySelector('a');

        anchor.addEventListener('click',(e)=>{
            e.preventDefault();
            console.log('blocked');
        });
    </script>
</body>
</html>
