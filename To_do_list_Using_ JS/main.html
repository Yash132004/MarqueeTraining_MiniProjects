<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
        <form action="" method="post">
            <h1>To-Do-List</h1>

            <div class="tasks">
                <input type="text" id="taskInput" placeholder="Add Your Task Here!">
                <button type="submit" id="submitbtn">ADD</button>
            </div>

            <br>

            <ul id="taskList"></ul>

        </form>
    </div>

    <script>
        let form = document.querySelector('form');
        let taskContainer = document.getElementById('taskList');

        
        let tasks = [];
        let idCounter = 0;  

        function renderTasks() {
            taskContainer.innerHTML = "";

            tasks.forEach((t) => {
                let task = document.createElement('div');
                task.className = 'task';
                task.dataset.id = t.id;  

                task.innerHTML = `
                    <p><span>${t.text}</span></p>
                    <div class = "btnDiv">
                        <button class="up-btn">▲</button>
                        <button class="down-btn">▼</button> 
                        
                        <select class="menu-btn">
                            <option value="" selected disabled>Actions</option>
                            <option value="edit">Edit</option>
                            <option value="del">Delete</option>
                        </select>
                    </div>

                `;

                taskContainer.appendChild(task);
            });
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            let taskData = taskInput.value.trim();

            if (taskData === "") {
                return;
            }

            tasks.push({ id: idCounter++, text: taskData });
            renderTasks();
            form.reset();
        });

        
        taskContainer.addEventListener('click', (event) => {
            let taskDiv = event.target.closest('.task');
            if (!taskDiv) return;

            let id = Number(taskDiv.dataset.id);
            let index = tasks.findIndex(t => t.id === id);
            if (index === -1) return;

            if (event.target.classList.contains('up-btn')) {
                if (index > 0) {
                    [tasks[index - 1], tasks[index]] = [tasks[index], tasks[index - 1]];
                    renderTasks();
                }
            }

            if (event.target.classList.contains('down-btn')) {
                if (index < tasks.length - 1) {
                    [tasks[index + 1], tasks[index]] = [tasks[index], tasks[index + 1]];
                    renderTasks();
                }
            }
        });

        taskContainer.addEventListener('change', (event) => {
            if (!event.target.classList.contains('menu-btn')) return;

            let taskDiv = event.target.closest('.task');
            let id = Number(taskDiv.dataset.id);
            let index = tasks.findIndex(t => t.id === id);
            if (index === -1) return;

            let action = event.target.value;

            if (action === 'del') {
                tasks.splice(index, 1);
                renderTasks();
            }

            if (action === 'edit') {
                let newText = prompt('Edit task:', tasks[index].text);
                if (newText !== null && newText.trim() !== "") {
                    tasks[index].text = newText.trim();
                    renderTasks();
                }
            }

            event.target.selectedIndex = 0; 
        });
    </script>
</body>

</html>
